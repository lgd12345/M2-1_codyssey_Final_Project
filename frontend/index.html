<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme before styles and the app bundle can paint.
      (() => {
        let theme
        try { theme = localStorage.getItem('claim-ui-theme') } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = 'light'
          try { if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark' } catch {}
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <meta name="description" content="공작기계의 이해부터 고객지원까지. MORRONO에서 공작기계 소개와 서비스 이용 안내를 확인하세요." />
    <title>공작기계 고객지원 | MORRONO</title>
    <link rel="icon" href="data:," />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
